<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ParkAR – parking Włocławska 169C</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0e16;--panel:#111827;--panel2:#18213a;--line:#253049;--text:#e9eef7;--mute:#8d99b0;--green:#22c55e;--red:#ef4444;--blue:#3b82f6;--ev:#14b8a6;--acc:#8b5cf6;--amber:#f59e0b;--mono:'JetBrains Mono',ui-monospace,monospace}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#04060b;color:var(--text);font-family:'Manrope',system-ui,-apple-system,Segoe UI,sans-serif;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
#app{position:relative;max-width:480px;height:100dvh;margin:0 auto;background:var(--bg);overflow:hidden;display:flex;flex-direction:column}
@media(min-width:720px){#app{height:min(930px,96dvh);margin:2dvh auto;border-radius:30px;border:1px solid #1d2638;box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 0 8px #0b0f18}}
.top{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:linear-gradient(#0c1220,#0a0e16);border-bottom:1px solid #151d2e;z-index:20}
.brand{display:flex;gap:10px;align-items:center}
.logo{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,#22c55e,#14b8a6 55%,#8b5cf6);display:grid;place-items:center;font-weight:800;font-size:17px;color:#04110a;letter-spacing:-1px}
.logo span{font-size:10px;margin-left:1px;color:#fff}
.bname{font-weight:800;font-size:16px;letter-spacing:-.3px}
.bcity{font-size:11px;color:var(--mute)}
.top-act{display:flex;gap:6px}
.ib{width:36px;height:36px;border-radius:11px;background:var(--panel);border:1px solid var(--line);font-weight:700;font-size:16px}
main{position:relative;flex:1;min-height:0}
.view{position:absolute;inset:0;display:none}
.view.active{display:block}
nav.tabs{display:flex;height:64px;background:#0c111c;border-top:1px solid #151d2e;z-index:40;position:relative}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--mute);position:relative}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:#fff}
nav.tabs button.on::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--acc)}
nav.tabs .dot{position:absolute;top:9px;right:calc(50% - 18px);width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 0 2px #0c111c;display:none}
nav.tabs .dot.show{display:block;animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.35}}
canvas{display:block;touch-action:none}
#map{position:absolute;inset:0;width:100%;height:100%}
.map-top{position:absolute;left:10px;right:10px;top:10px;z-index:5;pointer-events:none}
.stats{pointer-events:auto;display:flex;gap:6px;align-items:center;font-size:12px;background:rgba(12,17,28,.88);backdrop-filter:blur(8px);border:1px solid var(--line);padding:7px 10px;border-radius:12px;width:max-content;max-width:100%}
.stats b{font-family:var(--mono);font-size:13px}
.stats .sep{width:1px;height:14px;background:var(--line);margin:0 3px}
.chips{display:flex;gap:6px;margin-top:8px;overflow-x:auto;pointer-events:auto;scrollbar-width:none}
.chip{white-space:nowrap;display:flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:7px 11px;border-radius:999px;background:rgba(17,24,39,.9);border:1px solid var(--line);color:#cbd5e1}
.chip svg{width:14px;height:14px}
.chip.on{background:#e9eef7;color:#0a0e16;border-color:#e9eef7}
.chip.tog.on{background:var(--green);border-color:var(--green);color:#04110a}
.map-ctrl{position:absolute;right:10px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:8px;z-index:5}
.mb{width:42px;height:42px;border-radius:13px;background:rgba(17,24,39,.94);border:1px solid var(--line);font-size:20px;font-weight:700;display:grid;place-items:center}
.mb svg{width:20px;height:20px}
.mb.accent{background:var(--green);color:#04110a;border-color:var(--green);font-weight:800}
.legend{position:absolute;left:10px;bottom:10px;z-index:4;background:rgba(12,17,28,.9);border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-size:11px;color:#cbd5e1;display:grid;grid-template-columns:auto auto;gap:5px 12px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);margin-right:6px;vertical-align:-1px}
.legend .ic{display:inline-flex;width:15px;height:15px;border-radius:5px;align-items:center;justify-content:center;margin-right:5px;vertical-align:-3px}
.legend .ic svg{width:11px;height:11px}
.gps-badge{position:absolute;right:10px;bottom:10px;z-index:4;font-size:10px;font-weight:700;letter-spacing:.4px;padding:5px 8px;border-radius:8px;background:rgba(12,17,28,.9);border:1px solid var(--line);color:var(--mute)}
.park-here{position:absolute;left:50%;transform:translateX(-50%);bottom:64px;z-index:6;display:none;background:var(--acc);color:#fff;font-weight:700;font-size:13px;padding:10px 16px;border-radius:999px;box-shadow:0 8px 24px rgba(139,92,246,.45)}
.park-here.show{display:block}
.nav-banner{position:absolute;left:10px;right:10px;top:10px;z-index:7;display:none;background:linear-gradient(135deg,#6d28d9,#8b5cf6);border-radius:16px;padding:12px 14px;box-shadow:0 10px 30px rgba(109,40,217,.45);align-items:center;gap:12px}
.nav-banner.show{display:flex}
.nav-banner .arrow{width:46px;height:46px;border-radius:12px;background:rgba(255,255,255,.18);display:grid;place-items:center;flex:none}
.nav-banner .arrow svg{width:30px;height:30px}
.nav-banner .d{font-family:var(--mono);font-size:20px;font-weight:700}
.nav-banner .s{font-size:13px;opacity:.92}
.nav-card{position:absolute;left:0;right:0;bottom:0;z-index:8;background:var(--panel);border-top:1px solid var(--line);border-radius:20px 20px 0 0;padding:14px 16px 16px;display:none;box-shadow:0 -10px 30px rgba(0,0,0,.4)}
.nav-card.show{display:block}
.nav-card .row{display:flex;align-items:baseline;gap:10px}
.nav-card .eta{font-size:22px;font-weight:800;color:var(--green)}
.nav-card .meta{color:var(--mute);font-size:13px}
.nav-card .tgt{margin-top:6px;font-size:13px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sess-pill{position:absolute;left:50%;transform:translateX(-50%);top:92px;z-index:6;display:none;background:rgba(12,17,28,.94);border:1px solid #2c3b5c;border-radius:999px;padding:7px 14px;font-size:12px;font-weight:700;white-space:nowrap;cursor:pointer}
.sess-pill.show{display:flex;gap:8px;align-items:center}
.sess-pill .live{width:8px;height:8px;border-radius:50%;background:var(--green);animation:pulse 1.2s infinite}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:11px 14px;border-radius:13px;font-weight:700;font-size:14px;background:var(--panel2);border:1px solid var(--line)}
.btn svg{width:17px;height:17px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.go{background:var(--green);border-color:var(--green);color:#04110a}
.btn.danger{background:#3a1218;border-color:#6b1d27;color:#fecaca}
.btn.sm{padding:8px 11px;font-size:12px;border-radius:11px}
.btns{display:flex;gap:8px;margin-top:12px}
.btns .btn{flex:1}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:#1f2a44;color:#cbd5e1}
.tag svg{width:12px;height:12px}
.tag.free{background:rgba(34,197,94,.16);color:#4ade80}
.tag.occ{background:rgba(239,68,68,.16);color:#f87171}
.tag.dis{background:rgba(59,130,246,.18);color:#93c5fd}
.tag.ev{background:rgba(20,184,166,.18);color:#5eead4}
.tag.res{background:rgba(139,92,246,.2);color:#c4b5fd}
.mono{font-family:var(--mono)}
/* sheet */
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:30;background:var(--panel);border-top:1px solid var(--line);border-radius:22px 22px 0 0;padding:8px 16px 16px;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);max-height:72%;overflow:auto;box-shadow:0 -14px 40px rgba(0,0,0,.5)}
.sheet.open{transform:none}
.grab{width:40px;height:4px;border-radius:4px;background:#34405c;margin:2px auto 10px}
.sh-head{display:flex;gap:12px;align-items:center}
.sh-pin{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;flex:none}
.sh-pin svg{width:24px;height:24px;color:#fff}
.sh-id{font-family:var(--mono);font-weight:700;font-size:22px;letter-spacing:-.5px}
.sh-sub{font-size:12px;color:var(--mute)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.kv div{background:#0d1322;border:1px solid #1c2640;border-radius:12px;padding:8px 10px}
.kv small{display:block;color:var(--mute);font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;font-weight:700}
.kv b{font-size:14px}
.occbar{height:8px;border-radius:8px;background:#22c55e33;overflow:hidden;margin-top:8px}
.occbar span{display:block;height:100%;background:linear-gradient(90deg,#f97316,#ef4444)}
.spotchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.spotchips button{font-family:var(--mono);font-size:12px;font-weight:700;padding:5px 8px;border-radius:8px;background:rgba(34,197,94,.14);color:#4ade80;border:1px solid rgba(34,197,94,.3)}
.spotchips button.dis{background:rgba(59,130,246,.16);color:#93c5fd;border-color:rgba(59,130,246,.35)}
.spotchips button.ev{background:rgba(20,184,166,.16);color:#5eead4;border-color:rgba(20,184,166,.35)}
.hint{font-size:12px;color:var(--mute);margin-top:10px;line-height:1.45}
.warn{font-size:12px;color:#fcd34d;background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.3);padding:8px 10px;border-radius:10px;margin-top:10px}
/* AR */
#view-ar{background:#000}
#arVideo,#arImg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}
#arCanvas{position:absolute;inset:0;width:100%;height:100%}
.ar-top{position:absolute;left:10px;right:10px;top:10px;display:flex;justify-content:space-between;gap:8px;z-index:5;pointer-events:none}
.seg{display:flex;background:rgba(10,14,22,.78);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:3px;pointer-events:auto}
.seg button{font-size:11.5px;font-weight:700;padding:6px 9px;border-radius:9px;color:#cbd5e1}
.seg button.on{background:#fff;color:#0a0e16}
.ar-lot{pointer-events:auto;font-size:11.5px;font-weight:700;background:rgba(10,14,22,.78);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:7px 10px;text-align:right;line-height:1.25}
.ar-lot small{display:block;color:#94a3b8;font-weight:600}
.ar-layers{position:absolute;right:10px;top:64px;display:flex;flex-direction:column;gap:6px;z-index:5}
.ar-layers button{width:50px;padding:6px 0 4px;border-radius:12px;background:rgba(10,14,22,.72);border:1px solid rgba(255,255,255,.12);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:8.5px;font-weight:700;color:#cbd5e1}
.ar-layers button svg{width:18px;height:18px}
.ar-layers button.on{background:rgba(139,92,246,.85);border-color:#a78bfa;color:#fff}
.ar-pad{position:absolute;left:12px;bottom:14px;width:128px;height:128px;z-index:5}
.ar-pad button{position:absolute;width:42px;height:42px;border-radius:12px;background:rgba(10,14,22,.7);border:1px solid rgba(255,255,255,.16);font-size:18px;color:#fff;user-select:none;-webkit-user-select:none;touch-action:none}
.ar-pad button:active,.ar-pad button.hold{background:rgba(139,92,246,.85)}
.ar-pad .u{left:43px;top:0}.ar-pad .d{left:43px;bottom:0}.ar-pad .l{left:0;top:43px}.ar-pad .r{right:0;top:43px}
.ar-pad .mode{left:43px;top:43px;font-size:9px;font-weight:800;line-height:1.05;background:rgba(255,255,255,.1)}
.ar-steer{position:absolute;right:70px;bottom:24px;z-index:5;display:none;background:rgba(10,14,22,.7);border:1px solid rgba(255,255,255,.14);padding:8px 10px;border-radius:12px;font-size:10px;font-weight:700;color:#cbd5e1;text-align:center}
.ar-steer.show{display:block}
.ar-steer input{width:140px;display:block;margin-top:4px;accent-color:#8b5cf6}
.ar-assist{position:absolute;left:150px;right:66px;bottom:14px;z-index:5;display:none;background:rgba(10,14,22,.82);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:9px 11px;font-size:11.5px;line-height:1.45}
.ar-assist.show{display:block}
.ar-assist .t{font-weight:800;font-size:12px;display:flex;justify-content:space-between;margin-bottom:3px}
.ar-assist .bar{height:6px;background:#1f2937;border-radius:6px;overflow:hidden;margin-top:5px}
.ar-assist .bar span{display:block;height:100%;transition:width .15s}
.ar-calib{position:absolute;left:10px;right:66px;top:64px;z-index:6;display:none;background:rgba(10,14,22,.86);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:10px 12px;font-size:11px}
.ar-calib.show{display:block}
.ar-calib label{display:flex;align-items:center;gap:8px;margin:4px 0;font-weight:600;color:#cbd5e1}
.ar-calib label span{width:92px}
.ar-calib input{flex:1;accent-color:#8b5cf6}
.ar-hint{position:absolute;left:150px;right:66px;bottom:16px;z-index:4;font-size:10.5px;color:rgba(255,255,255,.7);text-align:center;pointer-events:none}
.ar-tele{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);z-index:6;display:none;text-align:center;background:rgba(10,14,22,.85);border:1px solid rgba(255,255,255,.15);border-radius:16px;padding:16px;width:78%}
.ar-tele.show{display:block}
/* pages */
.page{position:absolute;inset:0;overflow:auto;padding:16px}
.h1{font-size:22px;font-weight:800;letter-spacing:-.4px;margin:2px 0 4px}
.sub{color:var(--mute);font-size:13px;margin-bottom:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:16px}
.sess-hero{background:radial-gradient(120% 90% at 0% 0%,rgba(139,92,246,.35),transparent 60%),radial-gradient(100% 80% at 100% 100%,rgba(34,197,94,.22),transparent 60%),var(--panel);border:1px solid #2d3a5e;border-radius:24px;padding:18px}
.sess-spot{font-family:var(--mono);font-size:38px;font-weight:700;letter-spacing:-1.5px;margin-top:8px}
.sess-timer{font-family:var(--mono);font-size:44px;font-weight:700;margin:12px 0 2px;letter-spacing:-1px}
.sess-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px}
.sess-grid div{background:rgba(5,8,14,.5);border:1px solid #233052;border-radius:12px;padding:9px}
.sess-grid small{display:block;font-size:10px;color:var(--mute);font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.sess-grid b{font-size:15px}
.evbar{height:10px;border-radius:10px;background:#0f2a2a;margin-top:6px;overflow:hidden}
.evbar span{display:block;height:100%;background:linear-gradient(90deg,#14b8a6,#22c55e)}
.empty{text-align:center;padding:40px 14px;color:var(--mute)}
.empty svg{width:56px;height:56px;opacity:.5}
.sumrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.sumrow div{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px}
.sumrow small{display:block;font-size:10px;color:var(--mute);font-weight:700;text-transform:uppercase}
.sumrow b{font-size:16px}
.hitem{display:flex;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:8px;cursor:pointer}
.hitem .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none;font-family:var(--mono);font-weight:700;font-size:12px;color:#fff}
.hitem .mid{flex:1;min-width:0}
.hitem .t1{font-weight:700;font-size:14px}
.hitem .t2{font-size:12px;color:var(--mute)}
.hitem .r{text-align:right;font-family:var(--mono);font-size:13px;font-weight:700}
.hitem .r small{display:block;color:var(--mute);font-weight:500;font-family:'Manrope',sans-serif}
.dayh{font-size:11px;font-weight:800;color:var(--mute);text-transform:uppercase;letter-spacing:.6px;margin:14px 2px 8px}
/* modal */
.modal{position:absolute;inset:0;z-index:60;background:rgba(3,5,10,.7);backdrop-filter:blur(4px);display:none;align-items:flex-end;justify-content:center}
.modal.show{display:flex}
.modal .box{background:var(--panel);border:1px solid var(--line);border-radius:24px 24px 0 0;width:100%;max-height:88%;overflow:auto;padding:18px 18px 20px;animation:up .28s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.modal h3{margin:0 0 4px;font-size:19px}
.set{margin-top:14px}
.set .lab{font-size:12px;font-weight:700;color:var(--mute);margin-bottom:6px;text-transform:uppercase;letter-spacing:.4px}
.segm{display:flex;background:#0d1322;border:1px solid var(--line);border-radius:12px;padding:3px}
.segm button{flex:1;padding:8px 4px;border-radius:9px;font-size:12.5px;font-weight:700;color:#cbd5e1}
.segm button.on{background:var(--acc);color:#fff}
.inrow{display:flex;gap:8px}
.inrow label{flex:1;font-size:12px;color:var(--mute)}
.inrow input{width:100%;margin-top:4px;background:#0d1322;border:1px solid var(--line);border-radius:10px;padding:9px;color:#fff;font:inherit;font-family:var(--mono)}
.steps{counter-reset:s;padding:0;margin:10px 0 0;list-style:none}
.steps li{counter-increment:s;position:relative;padding:0 0 12px 38px;font-size:13.5px;line-height:1.45;color:#cbd5e1}
.steps li::before{content:counter(s);position:absolute;left:0;top:-2px;width:26px;height:26px;border-radius:9px;background:var(--panel2);border:1px solid var(--line);display:grid;place-items:center;font-weight:800;font-size:12px;color:#fff}
.steps b{color:#fff}
.sumbig{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.sumbig div{background:#0d1322;border:1px solid #1c2640;border-radius:14px;padding:10px 12px}
.sumbig small{display:block;font-size:10.5px;color:var(--mute);font-weight:700;text-transform:uppercase}
.sumbig b{font-size:18px;font-family:var(--mono)}
.toast{position:absolute;left:50%;top:70px;transform:translateX(-50%) translateY(-20px);z-index:80;background:#f8fafc;color:#0a0e16;font-weight:700;font-size:13px;padding:10px 14px;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:.25s;width:max-content;max-width:88%;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}
.cat-tools{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.cat-search{width:100%;background:#0d1322;border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:#fff;font:inherit;margin-top:4px}
.crow{display:flex;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:6px;cursor:pointer}
.crow .num{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-family:var(--mono);font-weight:700;font-size:15px;color:#fff;flex:none;position:relative}
.crow .num.dis{box-shadow:0 0 0 2.5px #60a5fa}
.crow .num.ev{box-shadow:0 0 0 2.5px #5eead4}
.crow .mid{flex:1;min-width:0}
.crow .t1{font-weight:700;font-size:13.5px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.crow .t2{font-size:11px;color:var(--mute);font-family:var(--mono);margin-top:2px}
.crow .r{text-align:right;font-size:11px;color:var(--mute);white-space:nowrap}
.crow .edit{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap}
.crow .edit button{font-size:11px;font-weight:700;padding:5px 8px;border-radius:8px;background:#0d1322;border:1px solid var(--line);color:#cbd5e1}

<body>
<div id="app">
  <header class="top">
    <div class="brand"><div class="logo">P<span>AR</span></div><div><div class="bname">ParkAR</div><div class="bcity">Włocławska 169C, Toruń</div></div></div>
    <div class="top-act"><button class="ib" id="btnHelp" title="Jak testować">?</button><button class="ib" id="btnSettings" title="Ustawienia">⚙</button></div>
  </header>
  <main>
    <section class="view active" id="view-map">
      <canvas id="map"></canvas>
      <div class="map-top" id="mapTop">
        <div class="stats" id="stats"></div>
        <div class="chips" id="chips">
          <button class="chip on" data-f="all">Wszystkie</button>
          <button class="chip" data-f="dis"><span class="ico-dis"></span>Dla inwalidów</button>
          <button class="chip" data-f="ev"><span class="ico-ev"></span>Ładowarki EV</button>
          <button class="chip tog" data-f="free">Tylko wolne</button>
        </div>
      </div>
      <div class="nav-banner" id="navBanner"></div>
      <div class="sess-pill" id="sessPill"></div>
      <div class="map-ctrl">
        <button class="mb" id="zIn" title="Przybliż">+</button>
        <button class="mb" id="zOut" title="Oddal">−</button>
        <button class="mb" id="btnLocate" title="Moja pozycja"></button>
        <button class="mb accent" id="btnNearest" title="Najbliższe wolne miejsce">P</button>
      </div>
      <div class="legend" id="legend"></div>
      <div class="gps-badge" id="gpsBadge">GPS: SYMULACJA</div>
      <button class="park-here" id="parkHere">Parkuję tutaj</button>
      <div class="nav-card" id="navCard"></div>
    </section>

    <section class="view" id="view-ar">
      <video id="arVideo" playsinline muted loop autoplay></video>
      <img id="arImg" alt="">
      <canvas id="arCanvas"></canvas>
      <div class="ar-top">
        <div class="seg" id="arSrc"><button data-src="sim" class="on">3D demo</button><button data-src="camera">Kamera</button><button data-src="video">Nagranie</button></div>
        <div class="ar-lot" id="arLot"></div>
      </div>
      <div class="ar-layers" id="arLayers"></div>
      <div class="ar-calib" id="arCalib">
        <div style="font-weight:800;margin-bottom:4px">Kalibracja AR</div>
        <div style="color:#94a3b8;margin-bottom:6px" id="calibHint">Dopasuj znaczniki do obrazu. Najdokładniej: stań na znanym miejscu i wybierz jego numer.</div>
        <label><span>Stoję na miejscu</span><select id="cSpot" style="flex:1;background:#0d1322;color:#fff;border:1px solid #253049;border-radius:8px;padding:5px"></select><button class="btn sm" id="cSpotBtn">Ustaw</button></label>
        <label><span>Korekta kompasu</span><input type="range" id="cYaw" min="-45" max="45" step="1" value="0"><b id="cYawv">0°</b></label>
        <label><span>Wysokość kamery</span><input type="range" id="cH" min="0.8" max="14" step="0.1" value="1.5"><b id="cHv">1.5 m</b></label>
        <label><span>Pole widzenia</span><input type="range" id="cF" min="35" max="110" step="1" value="62"><b id="cFv">62°</b></label>
        <label><span>Pochylenie</span><input type="range" id="cP" min="-70" max="15" step="1" value="-12"><b id="cPv">-12°</b></label>
      </div>
      <div class="ar-assist" id="arAssist"></div>
      <div class="ar-tele" id="arTele"></div>
      <div class="ar-pad" id="arPad">
        <button class="u" data-k="f">▲</button><button class="l" data-k="l">◀</button>
        <button class="mode" id="arMode">JAZDA</button>
        <button class="r" data-k="r">▶</button><button class="d" data-k="b">▼</button>
      </div>
      <div class="ar-hint" id="arHint">Przeciągnij, aby się rozejrzeć · dotknij znacznik miejsca</div>
      <div class="ar-steer" id="arSteer">SKRĘT KÓŁ<input type="range" id="steer" min="-100" max="100" value="0"></div>
      <input type="file" id="arFile" accept="video/*,image/*" hidden>
    </section>

    <section class="view" id="view-session"><div class="page" id="sessPage"></div></section>
    <section class="view" id="view-catalog"><div class="page" id="catPage"></div></section>
    <section class="view" id="view-history"><div class="page" id="histPage"></div></section>
    <div class="sheet" id="sheet"></div>
  </main>
  <nav class="tabs" id="tabs">
    <button data-v="map" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"/><path d="M9 4v14M15 6v14"/></svg>Mapa</button>
    <button data-v="ar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/><path d="m12 7 4 2.3v4.4L12 16l-4-2.3V9.3z"/></svg>AR</button>
    <button data-v="session"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/></svg>Postój<span class="dot" id="sessDot"></span></button>
    <button data-v="catalog"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>Katalog</button>
    <button data-v="history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l4 2"/></svg>Historia</button>
  </nav>
  <div class="modal" id="modal"><div class="box" id="modalBox"></div></div>
  <div class="toast" id="toast"></div>
</div>

const edges=[],adj={};Object.keys(NODE).forEach(k=>adj[k]=[]);
D.edges.forEach(([a,b,name,w])=>{const e={a,b,name,w,inner:name!=='ul. Włocławska',len:hyp(NODE[a],NODE[b])};edges.push(e);adj[a].push({to:b,e});adj[b].push({to:a,e})});
function projectToEdge(p){let best=null;for(const e of edges){const A=NODE[e.a],B=NODE[e.b];const dx=B.x-A.x,dy=B.y-A.y,L2=dx*dx+dy*dy;let t=clamp(((p.x-A.x)*dx+(p.y-A.y)*dy)/L2,0,1);const x=A.x+dx*t,y=A.y+dy*t,d=Math.hypot(p.x-x,p.y-y);if(!best||d<best.d)best={e,t,x,y,d}}return best}
function edgeBetween(a,b){const r=adj[a].find(o=>o.to===b);return r&&r.e}
function graphRoute(p1,p2){
 const s=projectToEdge(p1),t=projectToEdge(p2);
 if(s.e===t.e)return[{x:s.x,y:s.y,name:s.e.name,lot:s.e.inner},{x:t.x,y:t.y,name:s.e.name,lot:s.e.inner}];
 const dist={},prev={},done={};Object.keys(NODE).forEach(k=>{dist[k]=Infinity});
 dist[s.e.a]=s.e.len*s.t;dist[s.e.b]=s.e.len*(1-s.t);prev[s.e.a]=prev[s.e.b]='#';
 for(;;){let u=null,bd=Infinity;for(const k in dist)if(!done[k]&&dist[k]<bd){bd=dist[k];u=k}if(!u)break;done[u]=true;for(const {to,e} of adj[u]){const nd=dist[u]+e.len;if(nd<dist[to]){dist[to]=nd;prev[to]=u}}}
 const ca=dist[t.e.a]+t.e.len*t.t,cb=dist[t.e.b]+t.e.len*(1-t.t);const end=ca<cb?t.e.a:t.e.b;
 const path=[];for(let n=end;n&&n!=='#';n=prev[n])path.unshift(n);
 const pts=[{x:s.x,y:s.y,name:s.e.name,lot:s.e.inner}];
 path.forEach((n,k)=>{const e=k===0?s.e:edgeBetween(path[k-1],n);pts.push({x:NODE[n].x,y:NODE[n].y,name:e.name,lot:e.inner})});

 return pts;
}
function finalizeRoute(pts,spot,kind){
 const out=[];pts.forEach(p=>{const l=out[out.length-1];if(!l||Math.hypot(l.x-p.x,l.y-p.y)>.4)out.push(p)});
 const cum=[0];for(let i=1;i<out.length;i++)cum.push(cum[i-1]+hyp(out[i-1],out[i]));
 let time=0;for(let i=1;i<out.length;i++)time+=(cum[i]-cum[i-1])/(out[i].ext?11:out[i].lot?2.2:8.3);
 const r={pts:out,cum,total:cum[cum.length-1],time,spot,kind,far:out.some(p=>p.ext)};r.steps=buildSteps(r);return r;
}
function planRoute(from,sp){
 let pts=[{x:from.x,y:from.y,name:''}],start=from;
 if(hyp(from,J)>350){pts.push({x:J.x,y:J.y,name:'dojazd do VBC',ext:true});start=J}
 pts.push(...graphRoute(start,{x:sp.ax,y:sp.ay}));
 pts.push({x:sp.x,y:sp.y,name:'miejsce',lot:true});
 return finalizeRoute(pts,sp,'to');
}
function exitRoute(sp){const pts=[{x:sp.x,y:sp.y,name:'wyjazd',lot:true},{x:sp.ax,y:sp.ay,name:'wyjazd',lot:true}];pts.push(...graphRoute({x:sp.ax,y:sp.ay},NODE.WN));return finalizeRoute(pts,sp,'exit')}
function buildSteps(r){
 const P=r.pts,groups=[];
 for(let i=1;i<P.length;i++){const key=P[i].name||'start',g=groups[groups.length-1];const len=r.cum[i]-r.cum[i-1];
  if(g&&g.key===key){g.end=i;g.len+=len}else groups.push({key,start:i,end:i,len,from:r.cum[i-1]})}
 groups.forEach((g,k)=>{
  g.to=g.from+g.len;let dir='straight';
  if(k>0){const a=P[g.start-1],b=P[g.start],z=P[g.start-2]||a;const d1={x:a.x-z.x,y:a.y-z.y},d2={x:b.x-a.x,y:b.y-a.y};const ang=Math.atan2(d1.x*d2.y-d1.y*d2.x,d1.x*d2.x+d1.y*d2.y);dir=Math.abs(ang)<.5?'straight':ang>0?'right':'left'}
  g.dir=dir;const turn=dir==='right'?'Skręć w prawo':dir==='left'?'Skręć w lewo':'Jedź prosto';
  const side=dir==='right'?' (po prawej)':dir==='left'?' (po lewej)':'';
  if(g.key==='miejsce')g.text=`Zaparkuj na miejscu ${r.spot.id}${side}`;
  else if(g.key==='wyjazd')g.text='Wyjedź z miejsca';
  else if(g.key==='dojazd do VBC')g.text='Dojedź do wjazdu VBC (ul. Włocławska)';
  else if(k===0)g.text=g.key==='start'?'Ruszaj':`Ruszaj: ${g.key}`;
  else g.text=`${turn} → ${g.key}`;
 });
 return groups;
}
function pointAt(r,s){let i=1;while(i<r.cum.length-1&&r.cum[i]<s)i++;const a=r.pts[i-1],b=r.pts[i],seg=r.cum[i]-r.cum[i-1]||1,t=clamp((s-r.cum[i-1])/seg,0,1);return{x:lerp(a.x,b.x,t),y:lerp(a.y,b.y,t),h:Math.atan2(b.x-a.x,-(b.y-a.y)),lot:!!b.lot,i}}

function driveTick(dt,now){
 const d=S.drive;if(!d)return;
 const cur=pointAt(d.route,d.s);const v=cur.lot?2.8*Math.min(S.settings.driveK,2.5):11*S.settings.driveK;
 if(d.kind==='to'&&!d.stealChecked&&d.route.total-d.s<45&&S.settings.simOthers){d.stealChecked=true;const tg=d.route.spot;if(tg.res!=='me'&&Math.random()<.3){tg.occupied=true;tg.since=S.simTime;lostTarget();return}}

 const p=pointAt(d.route,d.s);S.car.x=p.x;S.car.y=p.y;S.car.h+=wrapA(p.h-S.car.h)*Math.min(1,dt*8);S.car.speed=v;

function detectTick(now){
 const real=S.gps==='real';
 if(!real&&S.car.speed>.6){S.stoppedAt=now;if(!S.session)S.parkArmed=true}
 const zone=zoneAt(S.car,2);
 let still;
 if(real){still=isStill(now)&&(S.car.acc||99)<=20;if(!isStill(now)&&!S.session)S.parkArmed=true}
 else still=S.car.speed<.6&&now-S.stoppedAt>1300;
 if(!S.session&&S.parkArmed&&zone&&still){
  const tol=real?clamp(S.car.acc||5,3,8):2.3;
  const near=spotsNear(S.car,tol);const pick=(near.find(o=>!o.sp.occupied||o.sp.mine)||near[0]);
  if(pick){S.parkArmed=false;if(pick.sp.occupied&&!pick.sp.mine)toast(`Miejsce ${pick.sp.id} jest oznaczone jako zajęte`);else startSession(pick.sp,'auto')}
 }
 if(S.session){
  const out=!zoneAt(S.car,real?8:5);
  if(out){if(!S.outSince)S.outSince=now}else S.outSince=0;
  const walk=S.settings.testMode==='walk';
  let end=false;
  if(out){if(real)end=now-S.outSince>(walk?8000:2500)&&(walk||S.car.speed>2.5);
   else end=(S.drive&&S.drive.kind==='exit')||(S.lastDriveExit&&now-S.lastDriveExit<2000)||S.car.speed>3.5||(walk&&now-S.outSince>1500)}

}

 const gx=(s0.x+s1.x+s2.x)/3,gy=(s0.y+s1.y+s2.y)/3,k=1.04;

 if(S.gps!=='real'||!S.raw){toast('Włącz „GPS telefonu” w ustawieniach i stań na środku miejsca');return}
 const F=S.fixes.filter(f=>performance.now()-f.t<6000&&f.lat);if(!F.length){toast('Czekam na sygnał GPS…');return}
 const lat=F.reduce((a,f)=>a+f.lat,0)/F.length,lon=F.reduce((a,f)=>a+f.lon,0)/F.length;const acc=Math.min(...F.map(f=>f.acc));

 OVR[sp.id]={...(OVR[sp.id]||{}),lat,lon};saveOvr();toast(`#${sp.n}: zapisano pozycję z GPS (±${Math.round(acc)} m, przesunięcie ${Math.hypot(dx,dy).toFixed(1)} m)`,4000);renderCatalog(true);

 const orr=$('#offReset');if(orr)orr.onclick=()=>{S.gpsOff={x:0,y:0};save();toast('Korekta GPS wyzerowana')};
 $('#iP').onchange=e=>{S.settings.price=Math.max(0,+e.target.value||0);save()};
 $('#iW').onchange=e=>{S.settings.carW=clamp(+e.target.value||1.85,1.4,2.4);save()};$('#iL').onchange=e=>{S.settings.carL=clamp(+e.target.value||4.6,3,6.5);save()};
 $('#mClear').onclick=()=>{S.history=[];save();renderHistory();toast('Historia wyczyszczona')};$('#mClose').onclick=closeModal;
}
$('#btnHelp').onclick=showHelp;$('#btnSettings').onclick=showSettings;

/* ================= GPS ================= */
function setGps(mode){
 if(mode==='real'){
  if(!navigator.geolocation){toast('Geolokalizacja niedostępna');return}
  S.gps='real';S.drive=null;S.fixes=[];$('#gpsBadge').textContent='GPS: ŁĄCZENIE…';renderLayers();
  try{S.watch=navigator.geolocation.watchPosition(pos=>{
   const c=pos.coords;const now=performance.now();S.raw={lat:c.latitude,lon:c.longitude,acc:c.accuracy};
   const p=ll2xy(c.latitude,c.longitude);const x=p.x+S.gpsOff.x,y=p.y+S.gpsOff.y;
   let sp=c.speed;if((sp==null||isNaN(sp))&&S.lastFix){sp=Math.hypot(x-S.lastFix.x,y-S.lastFix.y)/Math.max(.5,(now-S.lastFix.t)/1000)}
   if(c.heading!=null&&!isNaN(c.heading)&&(sp||0)>1)S.car.h=c.heading*Math.PI/180;
   S.car.x=x;S.car.y=y;S.car.speed=sp||0;S.car.acc=c.accuracy;S.lastFix={x,y,t:now};
   S.fixes.push({x,y,t:now,lat:c.latitude,lon:c.longitude,acc:c.accuracy});S.fixes=S.fixes.filter(f=>now-f.t<20000);
   $('#gpsBadge').textContent=`GPS ±${Math.round(c.accuracy)} m · ${fmtDist(hyp(S.car,LOT))} od VBC`;
  },err=>{toast('Brak dostępu do GPS w tym oknie – otwórz plik aplikacji w przeglądarce telefonu',4500);setGps('sim')},{enableHighAccuracy:true,maximumAge:0,timeout:20000})}catch(e){setGps('sim')}
 }else{if(S.watch!=null)try{navigator.geolocation.clearWatch(S.watch)}catch(e){}S.watch=null;S.gps='sim';$('#gpsBadge').textContent='GPS: SYMULACJA';renderLayers()}
}

/* ================= VIEWS & LOOP ================= */
function switchView(v){
 S.view=v;document.querySelectorAll('.view').forEach(s=>s.classList.toggle('active',s.id==='view-'+v));
 document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
 if(v!=='map'&&v!=='ar')closeSheet();
 if(v==='session')renderSession();if(v==='history')renderHistory();if(v==='catalog')renderCatalog();
 if(v==='ar'){AR.yaw=S.car.h;if(S.target&&hyp(S.target,S.car)<120)AR.yaw=Math.atan2(S.target.x-S.car.x,-(S.target.y-S.car.y));AR.near=false;if(AR.src==='sim')AR.pitch=-.13;if(S.sheet&&S.sheet.lot)closeSheet()}
}
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>switchView(b.dataset.v));
$('#sessPill').onclick=()=>switchView('session');
let uiT=0;
function uiTick(t){
 if(t-uiT<300)return;uiT=t;
 const all=S.spots.length,fr=freeCount(),fd=freeCount(s=>s.type==='dis'),fe=freeCount(s=>s.type==='ev');
 $('#stats').innerHTML=`<span style="color:#4ade80">●</span> Wolne <b>${fr}</b><span style="color:#8d99b0">/${all}</span><span class="sep"></span><span style="color:#93c5fd">♿</span> <b>${fd}</b><span class="sep"></span><span style="color:#5eead4">⚡</span> <b>${fe}</b><span class="sep"></span><span style="color:#8d99b0">VBC</span>`;
 const pill=$('#sessPill');if(S.session){pill.innerHTML=`<span class="live"></span><span class="mono">${S.session.spotId}</span><span class="mono" style="color:#cbd5e1">${fmtClock(S.simTime-S.session.startSim)}</span>`;pill.classList.add('show')}else pill.classList.remove('show');
 $('#sessDot').classList.toggle('show',!!S.session);
 $('#parkHere').classList.toggle('show',!S.session&&!S.drive&&!!zoneAt(S.car,S.gps==='real'?6:1)&&S.view==='map');
 if(S.route||S.drive)renderNav();
 updateSession();
 if(S.sheet&&S.sheet.spot&&S.sheet.spot.res==='me')refreshSheet();
}
let last=performance.now();
function frame(t){
 const dt=Math.min(.1,(t-last)/1000);last=t;
 S.simTime+=dt*1000*S.settings.timeScale;
 if(S.fly){V.cx=lerp(V.cx,S.fly.x,.14);V.cy=lerp(V.cy,S.fly.y,.14);V.z=Math.exp(lerp(Math.log(V.z),Math.log(S.fly.z),.14));if(Math.abs(V.cx-S.fly.x)<.3&&Math.abs(Math.log(V.z/S.fly.z))<.01)S.fly=null}
 else if(S.follow&&!S.drive&&S.view==='map'){V.cx=lerp(V.cx,S.car.x,.1);V.cy=lerp(V.cy,S.car.y,.1)}
 simTick(t);driveTick(dt,t);
 if(S.drive&&S.target&&S.drive.kind==='to'&&!isFree(S.target)&&S.target.res!=='me'&&!S.target.mine)lostTarget();
 detectTick(t);reserveTick();
 try{if(S.view==='map')renderMap(t);else if(S.view==='ar')renderAR(t,dt)}catch(err){console.error(err)}
 uiTick(t);requestAnimationFrame(frame);
}

/* ================= PERSISTENCE ================= */
function save(){try{localStorage.setItem(KEY,JSON.stringify({history:S.history,settings:S.settings,session:S.session,simTime:S.simTime,gpsOff:S.gpsOff,seen:true}))}catch(e){}}
function load(){try{const d=JSON.parse(localStorage.getItem(KEY)||'null');if(!d)return false;if(d.history)S.history=d.history;if(d.settings)Object.assign(S.settings,d.settings);if(d.simTime)S.simTime=d.simTime;if(d.gpsOff)S.gpsOff=d.gpsOff;
 if(d.session&&S.byId[d.session.spotId]){S.session=d.session;const sp=S.byId[d.session.spotId];sp.mine=true;sp.occupied=true;S.car.x=sp.x;S.car.y=sp.y;S.car.h=sp.h;S.parkArmed=false}return!!d.seen}catch(e){return false}}
setInterval(save,5000);

/* ================= INIT ================= */
const seen=load();seedOccupancy();if(S.session){const sp=S.byId[S.session.spotId];sp.mine=true;sp.occupied=true}
resize();renderSession();
requestAnimationFrame(t=>{last=t;resize();requestAnimationFrame(frame)});
if(!seen)setTimeout(showHelp,500);

</script>
</body>
</html>
